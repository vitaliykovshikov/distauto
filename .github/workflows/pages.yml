name: Test and deploy simulator
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test sketch and web interface
        run: python3 ukrkraft_kolona_v1_1/tests/run.py
      - name: Get Emscripten SDK
        uses: actions/checkout@v6
        with:
          repository: emscripten-core/emsdk
          path: .emsdk
      - name: Install Emscripten 4.0.20
        run: |
          .emsdk/emsdk install 4.0.20
          .emsdk/emsdk activate 4.0.20
      - name: Build the same sketch for the browser
        run: python3 simulator/build.py --emxx .emsdk/upstream/emscripten/em++
      - name: Test WebAssembly simulator
        run: node simulator/smoke_test.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.6.0'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-${{ runner.os }}-esp32-4.0.0-libs-v1
      - name: Install pinned ESP32 core and sketch libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@4.0.0
          arduino-cli lib install 'ElegantOTA@4.0.0' 'OneWire@2.3.8' 'DallasTemperature@4.0.6' 'Adafruit GFX Library@1.13.0' 'Adafruit SSD1306@2.5.17'
      - name: Compile real ESP32 firmware with LittleFS and OTA
        run: arduino-cli compile --fqbn esp32:esp32:esp32:PartitionScheme=min_spiffs ukrkraft_kolona_v1_1

  deploy:
    if: github.event_name != 'pull_request'
    needs: [build, firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
