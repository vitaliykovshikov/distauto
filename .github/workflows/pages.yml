name: Test and deploy simulator
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test sketch and web interface
        run: python3 ukrkraft_kolona_v1_1/tests/run.py
      - name: Get Emscripten SDK
        uses: actions/checkout@v6
        with:
          repository: emscripten-core/emsdk
          path: .emsdk
      - name: Install Emscripten 4.0.20
        run: |
          .emsdk/emsdk install 4.0.20
          .emsdk/emsdk activate 4.0.20
      - name: Build the same sketch for the browser
        run: python3 simulator/build.py --emxx .emsdk/upstream/emscripten/em++
      - name: Test WebAssembly simulator
        run: node simulator/smoke_test.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
